                  { char: "珍貴的", jyut: "zan1 gwai3 dik1", en: "Precious", sentence: "這是一份珍貴的禮物。", imgColor: "#EC4899", emoji: "💎" },
                  { char: "巨大的", jyut: "geoi6 daai6 dik1", en: "Giant", sentence: "大象有巨大的身體。", imgColor: "#64748B", emoji: "🐳" },
                  { char: "柔軟的", jyut: "jau4 jyun5 dik1", en: "Soft", sentence: "這張床像棉花一樣柔軟。", imgColor: "#3B82F6", emoji: "☁️" },
                  { char: "新鮮的", jyut: "san1 sin1 dik1", en: "Fresh", sentence: "這裡有新鮮的水果和蔬菜。", imgColor: "#10B981", emoji: "🍓" },
                  { char: "精彩的", jyut: "zing1 coi2 dik1", en: "Wonderful", sentence: "這場表演非常精彩。", imgColor: "#F43F5E", emoji: "✨" }
                ]
              }
            ]
          }
        };

        // --- 組件：主應用 ---
        function App() {
          const [view, setView] = useState('home'); 
          const [grade, setGrade] = useState(null);
          const [theme, setTheme] = useState(null);
          
          const goHome = () => {
            setView('home');
            setGrade(null);
            setTheme(null);
          };

          const selectGrade = (g) => {
            setGrade(g);
            setView('mode');
          };

          const selectMode = (mode) => {
            if (mode === 'learn') {
              setView('learn_themes');
            } else {
              setView('quiz');
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
              {/* 頂部導航欄 */}
              <header className="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
                <div className="flex items-center gap-2 cursor-pointer" onClick={goHome}>
                  <div className="bg-yellow-400 p-2 rounded-full">
                    <BookOpen className="text-white" size={24} />
                  </div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-700 tracking-wide ml-2">
                    初小學生高頻詞語表
                  </h1>
                </div>
                <div className="flex gap-2">
                   {view !== 'home' && (
                     <button onClick={() => setView(view === 'learn_card' ? 'learn_themes' : (view === 'learn_themes' || view === 'quiz' ? 'mode' : 'home'))} 
                             className="bg-slate-200 hover:bg-slate-300 text-slate-600 px-4 py-2 rounded-full font-bold flex items-center gap-2 transition-colors">
                       <ArrowLeft size={18} /> 返回
                     </button>
                   )}
                </div>
              </header>

              {/* 主要內容區 */}
              <main className="container mx-auto p-4 md:p-6 max-w-4xl">
                {view === 'home' && <GradeSelection onSelect={selectGrade} />}
                {view === 'mode' && <ModeSelection grade={grade} onSelect={selectMode} />}
                {view === 'learn_themes' && <ThemeSelection grade={grade} onSelect={(t) => { setTheme(t); setView('learn_card'); }} />}
                {view === 'learn_card' && <LearningZone theme={theme} onBack={() => setView('learn_themes')} />}
                {view === 'quiz' && <QuizZone grade={grade} onExit={() => setView('mode')} />}
              </main>
            </div>
          );
        }

        // --- 1. 年級選擇區 ---
        function GradeSelection({ onSelect }) {
          return (
            <div className="flex flex-col items-center animate-fadeIn">
              <h2 className="text-3xl font-bold text-center mb-8 text-slate-700">請選擇年級</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                {[1, 2, 3].map((g) => (
                  <button
                    key={g}
                    onClick={() => onSelect(g)}
                    className="group relative bg-white border-b-8 border-r-8 border-slate-200 hover:border-yellow-400 active:border-0 active:translate-y-2 active:translate-x-2 rounded-3xl p-8 transition-all duration-150 flex flex-col items-center justify-center gap-4 border-2 border-slate-100"
                  >
                    <div className={`w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg
                      ${g === 1 ? 'bg-emerald-400' : g === 2 ? 'bg-blue-400' : 'bg-purple-400'} group-hover:scale-110 transition-transform`}>
                      P{g}
                    </div>
                    <span className="text-2xl font-bold text-slate-600 group-hover:text-slate-800">
                      {g === 1 ? '一年級' : g === 2 ? '二年級' : '三年級'}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        // --- 2. 模式選擇區 ---
        function ModeSelection({ grade, onSelect }) {
          const gradeInfo = curriculumData[grade];
          
          return (
            <div className="flex flex-col items-center animate-fadeIn">
              <div className={`${gradeInfo.color} text-white px-6 py-2 rounded-full text-xl font-bold mb-6 shadow-md`}>
                {gradeInfo.title}
              </div>
              <h3 className="text-3xl font-bold text-slate-800 mb-10">你想做什麼？</h3>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-2xl">
                <button 
                  onClick={() => onSelect('learn')}
                  className="bg-white border-4 border-emerald-100 hover:border-emerald-400 rounded-3xl p-8 flex flex-col items-center gap-4 transition-all hover:shadow-xl group"
                >
                  <div className="bg-emerald-100 p-6 rounded-full group-hover:bg-emerald-200 transition-colors">
                    <BookOpen size={64} className="text-emerald-600" />
                  </div>
                  <div className="text-center">
                    <div className="text-2xl font-bold text-slate-800">學習區</div>
                    <div className="text-slate-500 text-lg font-medium">Learning Zone</div>
                  </div>
                </button>

                <button 
                  onClick={() => onSelect('quiz')}
                  className="bg-white border-4 border-rose-100 hover:border-rose-400 rounded-3xl p-8 flex flex-col items-center gap-4 transition-all hover:shadow-xl group"
                >
                  <div className="bg-rose-100 p-6 rounded-full group-hover:bg-rose-200 transition-colors">
                    <Gamepad2 size={64} className="text-rose-600" />
                  </div>
                  <div className="text-center">
                    <div className="text-2xl font-bold text-slate-800">測試區</div>
                    <div className="text-slate-500 text-lg font-medium">Quiz Zone</div>
                  </div>
                </button>
              </div>
            </div>
          );
        }

        // --- 3. 主題選擇區 ---
        function ThemeSelection({ grade, onSelect }) {
          const themes = curriculumData[grade].themes;
          const gradeInfo = curriculumData[grade];

          return (
            <div className="animate-fadeIn">
              <div className="flex flex-col items-center mb-8">
                <div className={`${gradeInfo.color} text-white px-4 py-1 rounded-full text-sm font-bold mb-2`}>
                    {gradeInfo.title}
                </div>
                <h2 className="text-3xl font-bold text-center text-slate-700">選擇學習主題</h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {themes.map((theme) => (
                  <button
                    key={theme.id}
                    onClick={() => onSelect(theme)}
                    className={`relative overflow-hidden rounded-3xl p-6 transition-all hover:scale-105 hover:shadow-lg border-b-4 text-left ${theme.color} bg-opacity-40 border-opacity-50 flex flex-col h-full`}
                  >
                    <div className="flex justify-between items-start mb-4">
                      <div className="bg-white p-3 rounded-2xl shadow-sm text-slate-700">
                        {theme.icon}
                      </div>
                    </div>
                    <h3 className="text-2xl font-bold text-slate-800 mb-1">{theme.name}</h3>
                    <p className="text-slate-600 font-medium mb-3 italic">{theme.en}</p>
                    <p className="text-sm text-slate-500 line-clamp-2 mt-auto">{theme.desc}</p>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        // --- 4. 學習區 (核心功能) ---
        function LearningZone({ theme, onBack }) {
          const [currentIndex, setCurrentIndex] = useState(0);
          const [feedback, setFeedback] = useState(null); 
          const [isSpeaking, setIsSpeaking] = useState(false);

          const word = theme.words[currentIndex];

          // 語音合成 (TTS)
          const playAudio = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel(); 
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'zh-HK'; 
              utterance.rate = 0.8; 
              window.speechSynthesis.speak(utterance);
            } else {
              alert("您的瀏覽器不支援語音播放");
            }
          };

          // 語音識別 (STT)
          const startListening = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
              alert("抱歉，您的瀏覽器不支援語音識別功能。請嘗試使用 Google Chrome 或 Edge。");
              return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-HK';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            setFeedback('listening');

            recognition.start();

            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              const cleanTranscript = transcript.replace(/[.,\/#!$%\^&\*;:{}=\-_`~() ]/g,"");
              const cleanTarget = word.char.replace(/[.,\/#!$%\^&\*;:{}=\-_`~() ]/g,"");

              if (cleanTranscript.includes(cleanTarget) || cleanTranscript === cleanTarget) {
                setFeedback('success');
                playSound('correct');
              } else {
                setFeedback('retry');
                playSound('wrong');
              }
            };

            recognition.onspeechend = () => {
              recognition.stop();
            };

            recognition.onerror = (event) => {
              console.error(event.error);
              setFeedback('retry');
            };
          };

          const playSound = (type) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = type === 'correct' ? "好棒！答對了" : "再試一次";
                const u = new SpeechSynthesisUtterance(msg);
                u.lang = 'zh-HK';
                window.speechSynthesis.speak(u);
            }
          };

          return (
            <div className="flex flex-col items-center animate-fadeIn max-w-2xl mx-auto">
              <div className="w-full mb-6">
                 <h3 className="text-xl font-bold text-slate-500 text-center mb-2">{theme.name}</h3>
                 <div className="w-full bg-slate-200 rounded-full h-2.5">
                    <div className="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" 
                         style={{ width: `${((currentIndex + 1) / theme.words.length) * 100}%` }}></div>
                 </div>
                 <p className="text-right text-sm text-slate-400 mt-1">{currentIndex + 1} / {theme.words.length}</p>
              </div>

              <div className="bg-white w-full rounded-[40px] shadow-xl p-6 md:p-10 relative border-4 border-slate-100">
                
                <div 
                    className="w-full h-40 md:h-56 rounded-3xl mb-6 shadow-md overflow-hidden flex items-center justify-center relative group"
                    style={{ backgroundColor: word.imgColor }}
                >
                   <div className="text-8xl md:text-9xl drop-shadow-md transform transition-transform duration-500 group-hover:scale-110">
                       {word.emoji}
                   </div>
                </div>

                <div className="text-center space-y-2">
                  <h1 className="text-5xl md:text-7xl font-bold text-slate-800 tracking-wider font-serif">
                    {word.char}
                  </h1>
                  
                  <div className="flex items-center justify-center gap-3 py-2">
                    <span className="text-xl text-slate-500 font-medium font-mono bg-slate-100 px-4 py-1 rounded-lg">
                      {word.jyut}
                    </span>
                    <button 
                      onClick={() => playAudio(word.char)}
                      className="bg-blue-500 hover:bg-blue-600 active:scale-95 text-white p-2 rounded-full transition-all shadow-lg hover:shadow-blue-200"
                      title="聆聽發音"
                    >
                      <Volume2 size={20} />
                    </button>
                  </div>

                  <p className="text-2xl text-slate-400 font-serif italic">{word.en}</p>

                  <div className="mt-4 bg-yellow-50 p-4 rounded-xl border border-yellow-200 text-slate-700 relative group cursor-pointer" onClick={() => playAudio(word.sentence)}>
                      <Volume2 size={16} className="absolute top-2 right-2 text-yellow-400 opacity-0 group-hover:opacity-100 transition-opacity" />
                      <p className="text-lg font-medium">「{word.sentence}」</p>
                  </div>
                </div>

                <div className="mt-8 flex flex-col items-center justify-center border-t pt-6 border-slate-100">
                    <div className="relative">
                        {feedback === 'listening' && (
                            <span className="absolute -inset-4 rounded-full bg-purple-200 animate-ping opacity-75"></span>
                        )}
                        <button 
                            onClick={startListening}
                            disabled={feedback === 'listening'}
                            className={`relative z-10 w-20 h-20 rounded-full flex items-center justify-center shadow-xl transition-all transform hover:scale-105 active:scale-95
                                ${feedback === 'listening' ? 'bg-purple-600' : 'bg-purple-500 hover:bg-purple-600'} text-white`}
                        >
                            <Mic size={32} />
                        </button>
                    </div>
                    
                    <p className="mt-3 text-slate-500 font-medium text-sm">按住麥克風讀出「{word.char}」</p>

                    <div className="h-12 mt-2 flex items-center justify-center w-full">
                        {feedback === 'success' && (
                            <div className="flex items-center gap-2 animate-bounce bg-green-100 text-green-700 px-6 py-2 rounded-full">
                                <div className="flex gap-0.5 text-yellow-500">
                                    <Star fill="currentColor" size={20} />
                                    <Star fill="currentColor" size={20} />
                                    <Star fill="currentColor" size={20} />
                                </div>
                                <span className="font-bold">正確！</span>
                            </div>
                        )}
                        {feedback === 'retry' && (
                            <div className="flex items-center gap-2 text-rose-600 bg-rose-100 px-6 py-2 rounded-full animate-shake">
                                <RefreshCcw size={18} />
                                <span className="font-bold">再試一次！</span>
                            </div>
                        )}
                    </div>
                </div>
              </div>

              <div className="flex gap-4 mt-6 w-full justify-between">
                 <button 
                   onClick={() => {
                     if (currentIndex > 0) {
                         setCurrentIndex(prev => prev - 1);
                         setFeedback(null);
                     }
                   }}
                   disabled={currentIndex === 0}
                   className={`flex-1 py-3 rounded-xl font-bold text-lg transition-all ${currentIndex === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-white text-slate-600 shadow-md hover:shadow-lg'}`}
                 >
                   上一頁
                 </button>
                 
                 <button 
                   onClick={() => {
                     if (currentIndex < theme.words.length - 1) {
                         setCurrentIndex(prev => prev + 1);
                         setFeedback(null);
                     } else {
                         onBack();
                     }
                   }}
                   className="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 py-3 rounded-xl font-bold text-lg shadow-md hover:shadow-lg transition-all"
                 >
                   {currentIndex === theme.words.length - 1 ? '完成主題' : '下一個'}
                 </button>
              </div>
            </div>
          );
        }

        // --- 5. 測試區 ---
        function QuizZone({ grade, onExit }) {
          const [quizState, setQuizState] = useState('intro'); 
          const [currentQ, setCurrentQ] = useState(0);
          const [score, setScore] = useState(0);
          const [questions, setQuestions] = useState([]);
          const [showFeedback, setShowFeedback] = useState(null); 

          useEffect(() => {
            if (quizState === 'intro') {
              const allWords = curriculumData[grade].themes.flatMap(t => t.words);
              const questionCount = Math.min(5, allWords.length);
              const shuffled = [...allWords].sort(() => 0.5 - Math.random());
              
              const selected = shuffled.slice(0, questionCount).map(word => {
                const distractors = allWords.filter(w => w.char !== word.char)
                                            .sort(() => 0.5 - Math.random())
                                            .slice(0, 2);
                const options = [word, ...distractors].sort(() => 0.5 - Math.random());
                const type = Math.random() > 0.5 ? 'text-to-image' : 'audio-to-image';
                return { answer: word, options, type };
              });
              setQuestions(selected);
            }
          }, [grade, quizState]);

          const handleAnswer = (option) => {
            if (showFeedback) return;

            const isCorrect = option.char === questions[currentQ].answer.char;
            if (isCorrect) setScore(s => s + 1);
            
            setShowFeedback(isCorrect ? 'correct' : 'wrong');
            playSound(isCorrect ? 'correct' : 'wrong');

            setTimeout(() => {
              setShowFeedback(null);
              if (currentQ < questions.length - 1) {
                setCurrentQ(q => q + 1);
              } else {
                setQuizState('result');
              }
            }, 1500);
          };

          const playSound = (type) => {
             if ('speechSynthesis' in window) {
                 window.speechSynthesis.cancel();
                 const msg = type === 'correct' ? "答對了" : "答錯了";
                 const u = new SpeechSynthesisUtterance(msg);
                 u.lang = 'zh-HK'; 
                 u.rate = 1.2;
                 window.speechSynthesis.speak(u);
             }
          };

          const playQuestionAudio = (text) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-HK';
            window.speechSynthesis.speak(u);
          };

          if (quizState === 'intro') {
            return (
              <div className="flex flex-col items-center justify-center h-full animate-fadeIn pt-10 text-center">
                <div className="bg-rose-100 p-8 rounded-full mb-6 animate-bounce">
                    <Award className="text-rose-500 w-24 h-24" />
                </div>
                <h2 className="text-4xl font-bold text-slate-800 mb-4">準備好接受挑戰了嗎？</h2>
                <p className="text-xl text-slate-500 mb-10">我們將進行 5 題小測驗！</p>
                <button 
                  onClick={() => setQuizState('playing')}
                  className="bg-rose-500 hover:bg-rose-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-xl transition-transform hover:scale-105"
                >
                  開始測試
                </button>
              </div>
            );
          }

          if (quizState === 'result') {
            const percentage = (score / questions.length) * 100;
            return (
              <div className="flex flex-col items-center justify-center animate-fadeIn pt-10">
                <h2 className="text-3xl font-bold text-slate-700 mb-8">測試完成！</h2>
                <div className="bg-white p-10 rounded-3xl shadow-xl text-center border-4 border-yellow-200">
                   <div className="text-6xl mb-4">{percentage === 100 ? '🏆' : percentage >= 60 ? '👍' : '💪'}</div>
                   <div className="text-5xl font-bold text-slate-800 mb-2">{score} / {questions.length}</div>
                   <p className="text-slate-500 text-lg">
                     {percentage === 100 ? "太厲害了！全對！" : percentage >= 60 ? "做得很好！" : "繼續加油！"}
                   </p>
                </div>
                <div className="flex gap-4 mt-10">
                    <button onClick={onExit} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-8 rounded-full">
                        返回目錄
                    </button>
                    <button onClick={() => { setQuizState('intro'); setCurrentQ(0); setScore(0); }} className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-8 rounded-full">
                        再玩一次
                    </button>
                </div>
              </div>
            );
          }

          const qData = questions[currentQ];
          return (
            <div className="max-w-2xl mx-auto animate-fadeIn">
              <div className="flex justify-between items-center mb-8 px-2">
                <span className="text-slate-500 font-bold text-lg">第 {currentQ + 1} 題</span>
                <div className="flex gap-1">
                    {[...Array(questions.length)].map((_, i) => (
                        <div key={i} className={`h-2 w-8 rounded-full ${i < currentQ ? 'bg-emerald-400' : i === currentQ ? 'bg-blue-500' : 'bg-slate-200'}`}></div>
                    ))}
                </div>
              </div>

              <div className="bg-white rounded-3xl p-8 shadow-lg border-2 border-slate-100 min-h-[300px] flex flex-col items-center justify-center">
                
                {qData.type === 'text-to-image' ? (
                   <div className="text-center">
                     <span className="text-slate-400 text-sm font-bold tracking-widest uppercase mb-2 block">看圖選詞</span>
                     <h2 className="text-9xl mb-8 drop-shadow-md">{qData.answer.emoji}</h2>
                   </div>
                ) : (
                   <div className="text-center">
                     <span className="text-slate-400 text-sm font-bold tracking-widest uppercase mb-4 block">聆聽選詞</span>
                     <button 
                       onClick={() => playQuestionAudio(qData.answer.char)}
                       className="bg-blue-500 text-white w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg animate-pulse hover:animate-none hover:scale-105 transition-transform"
                     >
                        <Volume2 size={40} />
                     </button>
                     <p className="text-slate-500">點擊喇叭聆聽題目</p>
                   </div>
                )}

                <div className="grid grid-cols-3 gap-4 w-full mt-8">
                   {qData.options.map((opt, idx) => (
                     <button
                       key={idx}
                       disabled={showFeedback !== null}
                       onClick={() => handleAnswer(opt)}
                       className={`aspect-square rounded-2xl flex items-center justify-center shadow-md transition-all transform hover:scale-105 border-4 overflow-hidden relative
                         ${showFeedback && opt.char === qData.answer.char ? 'border-green-500 ring-4 ring-green-200' : ''}
                         ${showFeedback === 'wrong' && opt.char !== qData.answer.char ? 'opacity-50' : ''}
                         ${!showFeedback ? 'hover:border-blue-300 border-transparent' : ''}
                       `}
                       style={{ backgroundColor: opt.imgColor }}
                     >
                       <span className="text-4xl md:text-5xl font-bold text-white drop-shadow-md">{opt.char}</span>
                       <div className="absolute top-0 right-0 w-12 h-12 bg-white opacity-20 rounded-bl-full"></div>
                     </button>
                   ))}
                </div>

                <div className="h-10 mt-6 flex items-center justify-center">
                   {showFeedback === 'correct' && <span className="text-green-500 font-bold text-xl flex items-center gap-2"><CheckCircle /> 答對了！</span>}
                   {showFeedback === 'wrong' && <span className="text-red-500 font-bold text-xl flex items-center gap-2"><XCircle /> 答錯了！</span>}
                </div>

              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
